<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Suman</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #000;
        --text: #fff;
        --muted: rgba(255,255,255,0.55);
        --accent: #5e72e4;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: radial-gradient(circle at top, #1a1a2e 0%, #000 70%);
        color: var(--text);
        font-family: "Space Grotesk", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        overflow-x: hidden;
      }
      .wrap { max-width: 34rem; }
      .code {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: clamp(6rem, 22vw, 11rem);
        line-height: 0.9;
        background: linear-gradient(135deg, #5e72e4, #b721ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        user-select: none;
      }
      h1 {
        margin-top: 1.5rem;
        font-family: "Instrument Serif", serif;
        font-weight: 400;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
      }
      p {
        margin-top: 1rem;
        color: var(--muted);
        font-weight: 300;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      a.btn {
        display: inline-block;
        margin-top: 2.25rem;
        padding: 0.85rem 2rem;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 9999px;
        background: rgba(255,255,255,0.05);
        color: #fff;
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: border-color .3s, background .3s, transform .3s;
      }
      a.btn:hover {
        border-color: rgba(255,255,255,0.5);
        background: rgba(255,255,255,0.1);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>This coordinate doesn't exist</h1>
      <p>The page you're looking for drifted off into cinematic space. Let's navigate you back to the portfolio.</p>
      <a class="btn" href="/">Back to home</a>
    </div>
  </body>
</html>
